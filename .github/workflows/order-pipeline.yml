name: order-pipeline

on:
  push:
    paths:
      - "examples/order-pipeline/**"
      - ".github/workflows/order-pipeline.yml"
  pull_request:
    paths:
      - "examples/order-pipeline/**"
      - ".github/workflows/order-pipeline.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/order-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/order-pipeline/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
